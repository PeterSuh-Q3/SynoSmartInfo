name: Build n Release Synology Smart Info Package (Cache-Controlled)
on:
  workflow_dispatch:
    inputs:
      use_cache:
        description: 'Use cache? (true/false)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  prepare:
    name: Prepare Release Tag
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.get_latest_tag.outputs.new_tag }}
    steps:
      - name: Get latest release tag from PeterSuh-Q3/SynoSmartInfo
        id: get_latest_tag
        run: |
          latest_tag=$(curl -s https://api.github.com/repos/PeterSuh-Q3/SynoSmartInfo/releases/latest | jq -r .tag_name)
          echo "Latest tag: $latest_tag"
          major=$(echo $latest_tag | cut -d. -f1 | tr -d 'v')
          minor=$(echo $latest_tag | cut -d. -f2)
          patch=$(echo $latest_tag | cut -d. -f3)
          if [ "$patch" -lt 9 ]; then
            patch=$((patch + 1))
          else
            patch=0
            minor=$((minor + 1))
          fi
          new_tag="v${major}.${minor}.${patch}"
          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT

  build-spk:
    name: Build Package ${{ github.event.inputs.use_cache || 'default' }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arch: ['epyc7002']
        dsm: ['7.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # [FIX 1] 외부 스크립트를 캐시 키 계산 전에 먼저 다운로드하고
      #         upstream 커밋 SHA를 캐시 키에 포함시켜
      #         외부 소스 변경 시 캐시가 무효화되도록 수정
      # ---------------------------------------------------------------
      - name: Get latest syno_smart_info.sh and capture upstream commit hash
        id: get_script
        run: |
          COMMIT=$(curl -s https://api.github.com/repos/007revad/Synology_SMART_info/commits/main \
            | jq -r .sha | cut -c1-8)
          echo "Upstream commit: $COMMIT"
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          curl -kL https://raw.githubusercontent.com/007revad/Synology_SMART_info/refs/heads/main/syno_smart_info.sh \
            -o ./src/bin/syno_smart_info.sh

      - name: Build setuid helper binary (x86_64, static)
        run: |
          set -eux
          mkdir -p ./src/bin/helper
          SRC=./synology/helper/smartinfo-helper.c
          gcc -O2 -static -Wall -o ./src/bin/helper/smartinfo-helper.x86_64 "$SRC"
          chmod 0755 ./src/bin/helper/smartinfo-helper.x86_64
          ls -la ./src/bin/helper

      - name: Synology Package Builder Github Action
        # Forked from tomgrv/synology-package-builder@v1.3.0: upstream's
        # docker image is missing xz-utils, so DSM7 chroot deployment
        # (which extracts .txz toolchains) fails on every non-noarch build.
        # See PeterSuh-Q3/synology-package-builder@fix/xz-utils-missing
        uses: PeterSuh-Q3/synology-package-builder@fix/xz-utils-missing
        with:
          dsm: ${{ matrix.dsm }}
          arch: ${{ matrix.arch }}
          output: ./dist
          
      - name: Add dsmappname to INFO
        run: |
          for f in ./dist/*.spk; do
            [[ "$f" == *_debug.spk ]] && continue
            tmpdir=$(mktemp -d)
            tar -xf "$f" -C "$tmpdir"
            # See build-test.yml's comment: ui/config now uses the
            # "dsm-wrapper.js" schema, not a bare .url entry.
            APPID=$(jq -r '.["dsm-wrapper.js"] | to_entries[] | select(.value.type=="app") | .key' src/ui/config)
            if ! grep -q "dsmappname" "$tmpdir/INFO"; then
              sed -i "s/dsmuidir=\"ui\"/dsmuidir=\"ui\"\ndsmappname=\"$APPID\"/" "$tmpdir/INFO"
            fi
            # The builder's create_info() never maps package.json's
            # ctl_stop/ctl_uninstall to INFO at all (silently dropped).
            # ctl_stop=no removes Package Center's Start/Stop toggle -
            # this is a per-request CGI, not a long-running daemon, so
            # "start/stop" is meaningless; only Open + Uninstall should
            # remain selectable after install.
            sed -i '/^ctl_stop=/d' "$tmpdir/INFO"
            echo 'ctl_stop="no"' >> "$tmpdir/INFO"
            # DSM's Package Center rejects manually-installed spks with
            # "spk is not from synology" (error 289) when INFO has no
            # checksum field. Real Synology-toolkit-built packages always
            # carry checksum=md5(package.tgz); compute and (re)write it.
            sed -i '/^checksum=/d' "$tmpdir/INFO"
            CHECKSUM=$(md5sum "$tmpdir/package.tgz" | awk '{print $1}')
            echo "checksum=\"$CHECKSUM\"" >> "$tmpdir/INFO"
            tar -cf "$f" -C "$tmpdir" $(ls "$tmpdir")
            rm -rf "$tmpdir"
          done

      - name: Remove debug spk and rename package
        run: |
          ls -l ./dist
          rm ./dist/*_debug.spk 2>/dev/null || true
          ls -l ./dist

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: SynoSmartInfo-${{ matrix.dsm }}-${{ github.event.inputs.use_cache || 'cached' }}
          path: ./dist/*.spk

      # ---------------------------------------------------------------
      # [FIX 2] workflow_dispatch 실행 시 github.ref_type은 항상 'branch'이므로
      #         'tag' 조건을 제거하고, use_cache == 'false'일 때만 릴리즈 제외
      #         (강제 재빌드=캐시 무시 시에는 테스트 목적으로 간주하여 릴리즈 스킵)
      # ---------------------------------------------------------------
      - name: Release
        if: github.event.inputs.use_cache != 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.new_tag }}
          # Without this, unattended runs (daily_check.yml's scheduled
          # trigger) publish a release with an empty body - noticed when
          # v2.0.2 came out of this workflow with no notes at all.
          # Auto-generated notes (commit log since the last tag) are a
          # reasonable default for scheduled releases; hand-written notes
          # for anything noteworthy can still replace them afterward.
          generate_release_notes: true
          files: |
            ./dist/*.spk
