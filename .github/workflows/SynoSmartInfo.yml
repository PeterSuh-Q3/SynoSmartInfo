name: Build n Release Synology Smart Info Package
on:
  workflow_dispatch:
    inputs:
      # Formerly "use_cache", which was misleading: it never controlled
      # the toolchain cache at all. The cache is handled unconditionally
      # by the package-builder action (actions/cache on
      # .toolkit/{pkgscripts-ng,toolkit_tarballs}, keyed
      # toolkit-<dsm>-<arch>) and can't be turned off from here. What
      # this flag actually gates is whether a GitHub release gets
      # published - so name it for that. Use build-test.yml if you just
      # want an artifact with no release.
      publish_release:
        description: 'Publish a GitHub release? (true/false)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  prepare:
    name: Prepare Release Tag
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.get_latest_tag.outputs.new_tag }}
    steps:
      - name: Get latest release tag from PeterSuh-Q3/SynoSmartInfo
        id: get_latest_tag
        run: |
          latest_tag=$(curl -s https://api.github.com/repos/PeterSuh-Q3/SynoSmartInfo/releases/latest | jq -r .tag_name)
          echo "Latest tag: $latest_tag"
          major=$(echo $latest_tag | cut -d. -f1 | tr -d 'v')
          minor=$(echo $latest_tag | cut -d. -f2)
          patch=$(echo $latest_tag | cut -d. -f3)
          if [ "$patch" -lt 9 ]; then
            patch=$((patch + 1))
          else
            patch=0
            minor=$((minor + 1))
          fi
          new_tag="v${major}.${minor}.${patch}"
          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT

  test-helper:
    name: Compile & functional-test setuid helper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile production helper (real target path)
        run: |
          set -eux
          mkdir -p /tmp/build
          gcc -O2 -static -Wall -Wextra -o /tmp/build/smartinfo-helper.x86_64 \
            synology/helper/smartinfo-helper.c
          file /tmp/build/smartinfo-helper.x86_64

      - name: Compile test helper (target overridden to /usr/bin/id)
        run: |
          set -eux
          gcc -O2 -Wall -Wextra -DTARGET_SCRIPT='"/usr/bin/id"' \
            -o /tmp/build/smartinfo-helper-test synology/helper/smartinfo-helper.c

      - name: Install setuid bit on test helper (root, same as postinst does)
        run: |
          set -eux
          sudo chown root:root /tmp/build/smartinfo-helper-test
          sudo chmod 6755 /tmp/build/smartinfo-helper-test
          ls -la /tmp/build/smartinfo-helper-test

      - name: Ensure an unprivileged test user exists
        run: |
          id nobody || sudo useradd -M -s /usr/sbin/nologin nobody

      - name: Reject unknown option (must NOT execute target, exit != 0)
        run: |
          set -eux
          if sudo -u nobody /tmp/build/smartinfo-helper-test "--evil" ; then
            echo "FAIL: helper accepted a disallowed option"; exit 1
          fi
          echo "OK: disallowed option rejected"

      - name: Reject too many arguments
        run: |
          set -eux
          if sudo -u nobody /tmp/build/smartinfo-helper-test "-a" "extra" ; then
            echo "FAIL: helper accepted extra arguments"; exit 1
          fi
          echo "OK: extra arguments rejected"

      - name: Accept whitelisted option and verify REAL privilege escalation
        run: |
          set -eux
          OUT="$(sudo -u nobody /tmp/build/smartinfo-helper-test -a)"
          echo "$OUT"
          echo "$OUT" | grep -q 'uid=0(root)' || { echo "FAIL: target did not run as root"; exit 1; }
          echo "OK: whitelisted option escalates caller (nobody) to root"

      - name: Accept empty option
        run: |
          set -eux
          OUT="$(sudo -u nobody /tmp/build/smartinfo-helper-test)"
          echo "$OUT"
          echo "$OUT" | grep -q 'uid=0(root)' || { echo "FAIL: empty-option run did not escalate"; exit 1; }

  build-spk:
    name: Build Package
    needs: [prepare, test-helper]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # [FIX 1] 외부 스크립트를 캐시 키 계산 전에 먼저 다운로드하고
      #         upstream 커밋 SHA를 캐시 키에 포함시켜
      #         외부 소스 변경 시 캐시가 무효화되도록 수정
      # ---------------------------------------------------------------
      - name: Get latest syno_smart_info.sh and capture upstream commit hash
        id: get_script
        run: |
          set -euo pipefail
          COMMIT=$(curl -sf https://api.github.com/repos/007revad/Synology_SMART_info/commits/main \
            | jq -r .sha | cut -c1-8)
          echo "Upstream commit: $COMMIT"
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT

          LATEST_TAG=$(curl -sf https://api.github.com/repos/007revad/Synology_SMART_info/releases/latest | jq -r .tag_name)
          echo "Upstream latest release tag: $LATEST_TAG"

          # A bare `curl -o` with no failure/content check was the actual
          # cause of v2.0.2 shipping a script from 2026-02 (v1.3.16):
          # when the download silently failed, the step kept going with
          # whatever was already checked out in git (a stale committed
          # copy), and nothing downstream noticed or failed the build.
          # --fail makes curl itself exit non-zero on a 4xx/5xx instead
          # of writing the error page as if it were the script; the
          # scriptver grep additionally guards against a 200 response
          # with unexpected/empty content.
          curl -sf --retry 5 --retry-delay 3 -kL \
            "https://raw.githubusercontent.com/007revad/Synology_SMART_info/${LATEST_TAG}/syno_smart_info.sh" \
            -o ./src/bin/syno_smart_info.sh

          DOWNLOADED_VER=$(grep -m1 '^scriptver=' ./src/bin/syno_smart_info.sh | tr -d '"' | cut -d= -f2)
          echo "Downloaded script version: ${DOWNLOADED_VER:-<none found>}"
          if [ "${DOWNLOADED_VER}" != "${LATEST_TAG}" ]; then
            echo "::error::Downloaded syno_smart_info.sh reports version '${DOWNLOADED_VER}', expected '${LATEST_TAG}' - refusing to build with a mismatched/stale script."
            exit 1
          fi

      # No Synology toolchain, no chroot, no Docker: nothing in this
      # package is compiled against Synology's toolchain (the only
      # native code is the setuid helper, built as a plain static
      # binary), and an .spk is just a tar. See build-spk.sh's header
      # comment, and build-test.yml which validated this same swap
      # first. This also retires the "Add dsmappname to INFO" sed-patch
      # step and the per-arch/dsm build matrix that existed only
      # because the toolchain builder needed one chroot per platform -
      # build-spk.sh writes dsmappname/ctl_stop/checksum straight from
      # package.json in one pass, no per-platform build required.
      - name: Build SPK
        run: ./build-spk.sh ./dist

      - name: Verify the built package
        run: |
          set -eux
          spk=$(ls ./dist/*.spk)
          workdir=$(mktemp -d)
          tar -xf "$spk" -C "$workdir"

          # INFO's checksum must match package.tgz, or DSM rejects the
          # package outright with "spk is not from synology" (error 289).
          declared=$(grep '^checksum=' "$workdir/INFO" | cut -d'"' -f2)
          actual=$(md5sum "$workdir/package.tgz" | awk '{print $1}')
          [ "$declared" = "$actual" ]

          # dsmappname must be present, or DSM never registers the
          # desktop app entry src/ui/config declares - the package
          # installs fine but no icon/popup window ever appears.
          grep -q '^dsmappname="PeterSuh.SynoSmartInfo.AppInstance"$' "$workdir/INFO"

          # A missing/non-setuid helper means no privileged path at all,
          # and privilege's "tool" section is what makes DSM apply the
          # setuid bit at install time - so both must be present.
          tar -tzf "$workdir/package.tgz" | grep -q 'bin/helper/smartinfo-helper'
          grep -q '"tool"' "$workdir/conf/privilege"

          # Third-party packages cannot declare run-as root anywhere in
          # privilege (DSM rejects with error 319 at verify time).
          ! grep -q '"run-as": *"root"' "$workdir/conf/privilege"

          file "$workdir/package.tgz"
          cat "$workdir/INFO"

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: SynoSmartInfo-x86_64
          path: ./dist/*.spk

      # workflow_dispatch always reports github.ref_type as 'branch', so
      # a 'tag' condition here would never match - gate on the input
      # instead. Defaults to publishing, including for daily_check.yml's
      # unattended trigger (which passes no inputs at all).
      - name: Release
        if: github.event.inputs.publish_release != 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.new_tag }}
          # Without this, unattended runs (daily_check.yml's scheduled
          # trigger) publish a release with an empty body - noticed when
          # v2.0.2 came out of this workflow with no notes at all.
          # Auto-generated notes (commit log since the last tag) are a
          # reasonable default for scheduled releases; hand-written notes
          # for anything noteworthy can still replace them afterward.
          generate_release_notes: true
          files: |
            ./dist/*.spk
