name: Build & Test (setuid helper)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'synology/helper/**'
      - 'synology/scripts/**'
      - 'src/**'
      - 'conf/**'
      - '.github/workflows/build-test.yml'

jobs:
  test-helper:
    name: Compile & functional-test setuid helper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile production helper (real target path)
        run: |
          set -eux
          mkdir -p /tmp/build
          gcc -O2 -static -Wall -Wextra -o /tmp/build/smartinfo-helper.x86_64 \
            synology/helper/smartinfo-helper.c
          file /tmp/build/smartinfo-helper.x86_64

      - name: Compile test helper (target overridden to /usr/bin/id)
        run: |
          set -eux
          gcc -O2 -Wall -Wextra -DTARGET_SCRIPT='"/usr/bin/id"' \
            -o /tmp/build/smartinfo-helper-test synology/helper/smartinfo-helper.c

      - name: Install setuid bit on test helper (root, same as postinst does)
        run: |
          set -eux
          sudo chown root:root /tmp/build/smartinfo-helper-test
          sudo chmod 6755 /tmp/build/smartinfo-helper-test
          ls -la /tmp/build/smartinfo-helper-test

      - name: Ensure an unprivileged test user exists
        run: |
          id nobody || sudo useradd -M -s /usr/sbin/nologin nobody

      - name: Reject unknown option (must NOT execute target, exit != 0)
        run: |
          set -eux
          if sudo -u nobody /tmp/build/smartinfo-helper-test "--evil" ; then
            echo "FAIL: helper accepted a disallowed option"; exit 1
          fi
          echo "OK: disallowed option rejected"

      - name: Reject too many arguments
        run: |
          set -eux
          if sudo -u nobody /tmp/build/smartinfo-helper-test "-a" "extra" ; then
            echo "FAIL: helper accepted extra arguments"; exit 1
          fi
          echo "OK: extra arguments rejected"

      - name: Accept whitelisted option and verify REAL privilege escalation
        run: |
          set -eux
          OUT="$(sudo -u nobody /tmp/build/smartinfo-helper-test -a)"
          echo "$OUT"
          echo "$OUT" | grep -q 'uid=0(root)' || { echo "FAIL: target did not run as root"; exit 1; }
          echo "OK: whitelisted option escalates caller (nobody) to root"

      - name: Accept empty option
        run: |
          set -eux
          OUT="$(sudo -u nobody /tmp/build/smartinfo-helper-test)"
          echo "$OUT"
          echo "$OUT" | grep -q 'uid=0(root)' || { echo "FAIL: empty-option run did not escalate"; exit 1; }

      - name: Upload production helper binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartinfo-helper-x86_64
          path: /tmp/build/smartinfo-helper.x86_64

  build-spk:
    name: Build SPK (no release)
    needs: test-helper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No Synology toolchain, no chroot, no Docker: nothing in this
      # package is compiled against Synology's toolchain (the only
      # native code is the setuid helper, built as a plain static
      # binary), and an .spk is just a tar. See build-spk.sh's header
      # comment. This also retires the "Add dsmappname + checksum to
      # INFO" sed-patch step that used to live here: build-spk.sh reads
      # dsmappname/ctl_stop/checksum straight from package.json/the
      # built package.tgz, so there's nothing left for the toolchain
      # builder's incomplete INFO generation to need patching around.
      - name: Build SPK
        run: ./build-spk.sh ./dist

      - name: Verify the built package
        run: |
          set -eux
          spk=$(ls ./dist/*.spk)
          workdir=$(mktemp -d)
          tar -xf "$spk" -C "$workdir"

          # INFO's checksum must match package.tgz, or DSM rejects the
          # package outright with "spk is not from synology" (error 289).
          declared=$(grep '^checksum=' "$workdir/INFO" | cut -d'"' -f2)
          actual=$(md5sum "$workdir/package.tgz" | awk '{print $1}')
          [ "$declared" = "$actual" ]

          # dsmappname must be present, or DSM never registers the
          # desktop app entry src/ui/config declares - the package
          # installs fine but no icon/popup window ever appears.
          grep -q '^dsmappname="PeterSuh.SynoSmartInfo.AppInstance"$' "$workdir/INFO"

          # A missing/non-setuid helper means no privileged path at all,
          # and privilege's "tool" section is what makes DSM apply the
          # setuid bit at install time - so both must be present.
          tar -tzf "$workdir/package.tgz" | grep -q 'bin/helper/smartinfo-helper'
          grep -q '"tool"' "$workdir/conf/privilege"

          # Third-party packages cannot declare run-as root anywhere in
          # privilege (DSM rejects with error 319 at verify time).
          ! grep -q '"run-as": *"root"' "$workdir/conf/privilege"

          file "$workdir/package.tgz"
          cat "$workdir/INFO"

      - name: Upload built SPK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SynoSmartInfo-x86_64-test-build
          path: ./dist/*.spk
