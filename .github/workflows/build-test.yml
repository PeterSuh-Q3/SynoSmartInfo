name: Build & Test (setuid helper)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'synology/helper/**'
      - 'synology/scripts/**'
      - 'src/**'
      - 'conf/**'
      - '.github/workflows/build-test.yml'

jobs:
  test-helper:
    name: Compile & functional-test setuid helper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile production helper (real target path)
        run: |
          set -eux
          mkdir -p /tmp/build
          gcc -O2 -static -Wall -Wextra -o /tmp/build/smartinfo-helper.x86_64 \
            synology/helper/smartinfo-helper.c
          file /tmp/build/smartinfo-helper.x86_64

      - name: Compile test helper (target overridden to /usr/bin/id)
        run: |
          set -eux
          gcc -O2 -Wall -Wextra -DTARGET_SCRIPT='"/usr/bin/id"' \
            -o /tmp/build/smartinfo-helper-test synology/helper/smartinfo-helper.c

      - name: Install setuid bit on test helper (root, same as postinst does)
        run: |
          set -eux
          sudo chown root:root /tmp/build/smartinfo-helper-test
          sudo chmod 6755 /tmp/build/smartinfo-helper-test
          ls -la /tmp/build/smartinfo-helper-test

      - name: Ensure an unprivileged test user exists
        run: |
          id nobody || sudo useradd -M -s /usr/sbin/nologin nobody

      - name: Reject unknown option (must NOT execute target, exit != 0)
        run: |
          set -eux
          if sudo -u nobody /tmp/build/smartinfo-helper-test "--evil" ; then
            echo "FAIL: helper accepted a disallowed option"; exit 1
          fi
          echo "OK: disallowed option rejected"

      - name: Reject too many arguments
        run: |
          set -eux
          if sudo -u nobody /tmp/build/smartinfo-helper-test "-a" "extra" ; then
            echo "FAIL: helper accepted extra arguments"; exit 1
          fi
          echo "OK: extra arguments rejected"

      - name: Accept whitelisted option and verify REAL privilege escalation
        run: |
          set -eux
          OUT="$(sudo -u nobody /tmp/build/smartinfo-helper-test -a)"
          echo "$OUT"
          echo "$OUT" | grep -q 'uid=0(root)' || { echo "FAIL: target did not run as root"; exit 1; }
          echo "OK: whitelisted option escalates caller (nobody) to root"

      - name: Accept empty option
        run: |
          set -eux
          OUT="$(sudo -u nobody /tmp/build/smartinfo-helper-test)"
          echo "$OUT"
          echo "$OUT" | grep -q 'uid=0(root)' || { echo "FAIL: empty-option run did not escalate"; exit 1; }

      - name: Upload production helper binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartinfo-helper-x86_64
          path: /tmp/build/smartinfo-helper.x86_64

  build-spk:
    name: Build SPK (no release)
    needs: test-helper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build setuid helper binary (x86_64, static)
        run: |
          set -eux
          mkdir -p ./src/bin/helper
          gcc -O2 -static -Wall -o ./src/bin/helper/smartinfo-helper.x86_64 \
            ./synology/helper/smartinfo-helper.c
          chmod 0755 ./src/bin/helper/smartinfo-helper.x86_64

      - name: Synology Package Builder Github Action
        # Forked from tomgrv/synology-package-builder@v1.3.0: upstream's
        # docker image is missing xz-utils, so DSM7 chroot deployment
        # (which extracts .txz toolchains) fails on every non-noarch build.
        # See PeterSuh-Q3/synology-package-builder@fix/xz-utils-missing
        uses: PeterSuh-Q3/synology-package-builder@fix/xz-utils-missing
        with:
          dsm: '7.4'
          arch: 'epyc7002'
          output: ./dist

      - name: Add dsmappname + checksum to INFO
        run: |
          for f in ./dist/*.spk; do
            [[ "$f" == *_debug.spk ]] && continue
            tmpdir=$(mktemp -d)
            tar -xf "$f" -C "$tmpdir"
            # Without dsmappname, DSM never registers the desktop app
            # entry that src/ui/config declares - the package installs
            # fine but no icon/popup window ever appears. This step
            # existed in SynoSmartInfo.yml (the release workflow) but
            # was missing here, so every test build this session never
            # actually had a working popup, even though the underlying
            # mechanism (dsmuidir + dsmappname + ui/config's .url entry)
            # was already correct.
            APPID=$(jq -r '.[] | keys[]' src/ui/config)
            if ! grep -q "dsmappname" "$tmpdir/INFO"; then
              sed -i "s/dsmuidir=\"ui\"/dsmuidir=\"ui\"\ndsmappname=\"$APPID\"/" "$tmpdir/INFO"
            fi
            # The builder's create_info() never maps package.json's
            # ctl_stop/ctl_uninstall to INFO at all (silently dropped).
            # ctl_stop=no removes Package Center's Start/Stop toggle -
            # this is a per-request CGI, not a long-running daemon, so
            # "start/stop" is meaningless; only Open + Uninstall should
            # remain selectable after install.
            sed -i '/^ctl_stop=/d' "$tmpdir/INFO"
            echo 'ctl_stop="no"' >> "$tmpdir/INFO"
            # DSM's Package Center rejects manually-installed spks with
            # "spk is not from synology" (error 289) when INFO has no
            # checksum field. Real Synology-toolkit-built packages always
            # carry checksum=md5(package.tgz); compute and (re)write it.
            sed -i '/^checksum=/d' "$tmpdir/INFO"
            CHECKSUM=$(md5sum "$tmpdir/package.tgz" | awk '{print $1}')
            echo "checksum=\"$CHECKSUM\"" >> "$tmpdir/INFO"
            tar -cf "$f" -C "$tmpdir" $(ls "$tmpdir")
            rm -rf "$tmpdir"
          done

      - name: Remove debug spk
        run: |
          ls -l ./dist
          rm -f ./dist/*_debug.spk

      - name: Upload built SPK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SynoSmartInfo-x86_64-test-build
          path: ./dist/*.spk
