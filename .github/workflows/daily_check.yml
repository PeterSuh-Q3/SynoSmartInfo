name: Daily Check for Scriptversion Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # 매일 자정 UTC 기준 실행

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest release tag from PeterSuh-Q3/SynoSmartInfo
        id: get_latest_tag
        run: |
          latest_tag=$(curl -s https://api.github.com/repos/PeterSuh-Q3/SynoSmartInfo/releases/latest | jq -r .tag_name)
          echo "Latest tag: $latest_tag"
          major=$(echo $latest_tag | cut -d. -f1 | tr -d 'v')
          minor=$(echo $latest_tag | cut -d. -f2)
          patch=$(echo $latest_tag | cut -d. -f3)
          if [ "$patch" -lt 9 ]; then
            patch=$((patch + 1))
          else
            patch=0
            minor=$((minor + 1))
          fi
          new_tag="v${major}.${minor}.${patch}"
          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT

      - name: Get latest release tag from 007revad/Synology_SMART_info
        id: get_tag
        run: |
          latest_tag=$(curl -s https://api.github.com/repos/007revad/Synology_SMART_info/releases/latest | jq -r .tag_name)
          echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT

      - name: Get current scriptversion from package.json
        id: get_scriptversion
        run: |
          current_version=$(jq -r '.scriptversion' script.json)
          echo "current_version=$current_version" >> $GITHUB_OUTPUT

      - name: Compare versions and trigger SynoSmartInfo.yml if different
        run: |
          set -euo pipefail
          LATEST_TAG="${{ steps.get_tag.outputs.latest_tag }}"
          CURRENT_VER="${{ steps.get_scriptversion.outputs.current_version }}"

          if [ "${LATEST_TAG}" = "${CURRENT_VER}" ]; then
            echo "Versions match (${CURRENT_VER}). No action needed."
            exit 0
          fi

          echo "Upstream ${LATEST_TAG} != ours ${CURRENT_VER} - updating."

          # Pull the actual script, not just the version string.
          #
          # This workflow used to bump script.json/package.json only, on
          # the assumption that SynoSmartInfo.yml would fetch the real
          # file at build time. That fetch had no failure check, so when
          # it silently failed the build shipped whatever stale copy was
          # committed here - which is exactly how v2.0.2 went out with
          # v1.3.16 while script.json claimed v1.4.38. Fetch it here,
          # verify it, and commit it alongside the version bump so the
          # repo state is self-consistent and reviewable.
          curl -sf --retry 5 --retry-delay 3 -L \
            "https://raw.githubusercontent.com/007revad/Synology_SMART_info/${LATEST_TAG}/syno_smart_info.sh" \
            -o ./src/bin/syno_smart_info.sh

          DOWNLOADED_VER=$(grep -m1 '^scriptver=' ./src/bin/syno_smart_info.sh | tr -d '"' | cut -d= -f2)
          if [ "${DOWNLOADED_VER}" != "${LATEST_TAG}" ]; then
            echo "::error::Downloaded syno_smart_info.sh reports '${DOWNLOADED_VER}', expected '${LATEST_TAG}' - aborting."
            exit 1
          fi
          echo "Downloaded and verified syno_smart_info.sh ${DOWNLOADED_VER}"

          jq --arg tag "${LATEST_TAG}" '.scriptversion = $tag' script.json > tmp.json && mv tmp.json script.json
          jq --arg newtag "${{ steps.get_latest_tag.outputs.new_tag }}" '.version = ($newtag | sub("^v"; ""))' package.json > tmp.json && mv tmp.json package.json

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add script.json package.json src/bin/syno_smart_info.sh
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update syno_smart_info.sh to ${LATEST_TAG}"
            git push
          fi

          echo "Triggering SynoSmartInfo.yml workflow..."
          gh workflow run SynoSmartInfo.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
